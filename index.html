<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#8fd3ff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="강아지런" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon.png" />
<title>🐶 강아지 런 3D</title>

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0d1230;
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    color: #fff; -webkit-user-select: none; user-select: none; touch-action: none;
    overscroll-behavior: none;
  }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* 상단 HUD */
  #hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    font-weight: 800; pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,.4);
  }
  .chip { background: rgba(10,16,40,.42); border-radius: 999px; padding: 6px 12px; font-size: 15px; backdrop-filter: blur(4px); }
  #dist { font-size: 26px; letter-spacing: .5px; }
  #dist small { font-size: 12px; opacity: .7; font-weight: 600; }

  /* 하단 터치 조작 */
  #pad { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
    pointer-events: none;
  }
  #pad .side { display: flex; gap: 12px; pointer-events: auto; }
  .key {
    width: 68px; height: 68px; border-radius: 20px; border: none;
    background: rgba(255,255,255,.92); color: #23306a; font-size: 28px; font-weight: 900;
    display: grid; place-items: center; box-shadow: 0 6px 0 rgba(0,0,0,.16);
    pointer-events: auto;
  }
  .key:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.16); }
  .key.jump { width: 92px; height: 92px; font-size: 20px; background: linear-gradient(180deg,#ffb057,#ff7a3d); color:#fff; box-shadow: 0 6px 0 #d95e28; }

  /* 오버레이 */
  .screen { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center;
    background: rgba(10,14,36,.55); backdrop-filter: blur(4px); text-align: center; padding: 22px; }
  .screen.hidden { display: none; }
  .card { background: #fff; color: #23306a; border-radius: 24px; padding: 26px 22px; width: min(90%, 340px);
    box-shadow: 0 24px 70px rgba(0,0,0,.45); }
  .card h1 { margin: 0 0 4px; font-size: 30px; }
  .card p { margin: 8px 0 18px; font-size: 15px; line-height: 1.6; color: #56618c; }
  .card button { border: none; border-radius: 14px; padding: 14px 22px; font-size: 17px; font-weight: 900;
    background: linear-gradient(180deg,#ffb057,#ff7a3d); color: #fff; box-shadow: 0 5px 0 #d95e28; cursor: pointer; }
  .card button:active { transform: translateY(3px); box-shadow: 0 2px 0 #d95e28; }
  .hint { margin-top: 14px; font-size: 12px; color: #8b93b4; }
  #loading { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: #0d1230; color:#fff; font-weight:800; }
</style>

<canvas id="c"></canvas>

<div id="hud" style="display:none">
  <div class="chip">🦴 <span id="coins">0</span></div>
  <div class="chip" id="dist"><span id="m">0</span><small> m</small></div>
  <div class="chip">❤️ <span id="lives">3</span></div>
</div>

<div id="pad" style="display:none">
  <div class="side"><button class="key" id="kL">◀</button></div>
  <button class="key jump" id="kJ">점프</button>
  <div class="side"><button class="key" id="kR">▶</button></div>
</div>

<div class="screen" id="start">
  <div class="card">
    <h1>🐶 강아지 런 3D</h1>
    <p>강아지가 신나게 앞으로 달려요!<br><b>좌우로 레인을 바꿔</b> 장애물을 피하고, <b>점프</b>로 뛰어넘으며 🦴 뼈다귀를 모아요.</p>
    <button id="play">달리기 시작 ▶</button>
    <div class="hint">폰: 아래 버튼 또는 화면 쓸기(스와이프) · PC: ← → ↑ 방향키</div>
  </div>
</div>

<div class="screen hidden" id="over">
  <div class="card">
    <h1 id="ovTitle">💫</h1>
    <p id="ovText"></p>
    <button id="again">다시 달리기 🔄</button>
  </div>
</div>

<div id="loading">불러오는 중… 🐾</div>

<script src="three.min.js"></script>
<script>
/* ============================================================================
   🐶 강아지 런 3D — 무한 달리기 게임
   ----------------------------------------------------------------------------
   🎮 아래 값들을 바꾸면 게임 느낌이 달라져요! (딸과 함께 실험해보세요)
   ============================================================================ */
const CFG = {
  startSpeed: 13,     // 시작 달리기 속도
  maxSpeed: 30,       // 최고 속도
  accel: 0.28,        // 점점 빨라지는 정도(초당)
  lanes: [-2.2, 0, 2.2], // 좌·중·우 레인 위치
  jumpPower: 10.5,    // 점프 힘
  gravity: 26,        // 중력
  lives: 3,           // 목숨
};

let scene, camera, renderer, clock;
let dog, dogParts;
const obstacles = [], coins = [], trees = [], stripes = [];
let state; // 게임 상태

// ---------- 초기화 ----------
function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8fd3ff);
  scene.fog = new THREE.Fog(0x8fd3ff, 24, 62);   // 멀리 안개로 자연스럽게

  camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
  camera.position.set(0, 4.2, 8);
  camera.lookAt(0, 0.9, -8);

  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;   // 색이 더 또렷하게

  // 빛
  const hemi = new THREE.HemisphereLight(0xffffff, 0x6b8f4e, 0.72);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff2d8, 1.1);
  sun.position.set(-8, 16, 6);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 60;
  sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
  sun.shadow.camera.top = 12; sun.shadow.camera.bottom = -12;
  scene.add(sun);
  scene.add(sun.target);

  // 잔디 바닥
  const grass = new THREE.Mesh(
    new THREE.PlaneGeometry(60, 260),
    new THREE.MeshStandardMaterial({ color: 0x74c25a })
  );
  grass.rotation.x = -Math.PI/2; grass.position.z = -100; grass.receiveShadow = true;
  scene.add(grass);
  // 흙길 (레인들이 놓인 길)
  const road = new THREE.Mesh(
    new THREE.PlaneGeometry(8.2, 260),
    new THREE.MeshStandardMaterial({ color: 0xcaa06a })
  );
  road.rotation.x = -Math.PI/2; road.position.set(0, 0.01, -100); road.receiveShadow = true;
  scene.add(road);

  // 길 위 가로줄무늬 (속도감) — 움직였다가 재활용
  for (let i = 0; i < 22; i++) {
    const s = new THREE.Mesh(
      new THREE.PlaneGeometry(8.2, 0.5),
      new THREE.MeshStandardMaterial({ color: 0xb08753 })
    );
    s.rotation.x = -Math.PI/2; s.position.set(0, 0.02, -i * 5);
    scene.add(s); stripes.push(s);
  }

  // 길가 나무들
  for (let i = 0; i < 16; i++) addTree(i);

  // 강아지
  dog = buildDog();
  scene.add(dog);

  addEventListener("resize", onResize);
  bindControls();
  clock = new THREE.Clock();
  document.getElementById("loading").style.display = "none";
  renderer.render(scene, camera); // 첫 프레임
  animate();
}

// ---------- 강아지 3D 캐릭터 만들기 ----------
function buildDog() {
  const outer = new THREE.Group();
  const g = new THREE.Group();
  const cream = new THREE.MeshStandardMaterial({ color: 0xf0dcae, roughness: 0.85 });
  const creamD = new THREE.MeshStandardMaterial({ color: 0xdcc088, roughness: 0.85 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x2b2320 });
  const red  = new THREE.MeshStandardMaterial({ color: 0xd83b3b, roughness: 0.5 });
  const pink = new THREE.MeshStandardMaterial({ color: 0xff8fa3 });
  const dress = new THREE.MeshStandardMaterial({ color: 0xeaf1ff, roughness: 0.9 });

  const sph = (r, m, sx, sy, sz) => { const o = new THREE.Mesh(new THREE.SphereGeometry(r, 18, 14), m); if(sx)o.scale.set(sx,sy,sz); o.castShadow=true; return o; };
  const box = (w,h,d,m) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m); o.castShadow=true; return o; };

  // 몸통
  const body = sph(1.05, cream, 1, 0.9, 1.25); body.position.set(0, 1.0, 0); g.add(body);
  // 꽃무늬 원피스(치마) — 아래를 감싸는 원뿔
  const skirt = new THREE.Mesh(new THREE.ConeGeometry(1.25, 1.1, 20, 1, true), dress);
  skirt.position.set(0, 0.7, 0.05); skirt.castShadow = true; g.add(skirt);
  const flowerMat = new THREE.MeshStandardMaterial({ color: 0xff9dc0 });
  for (let i = 0; i < 6; i++) {
    const f = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 6), flowerMat);
    const a = i/6 * Math.PI*2;
    f.position.set(Math.cos(a)*0.95, 0.55 + (i%2)*0.2, Math.sin(a)*0.95 + 0.05);
    g.add(f);
  }

  // 머리
  const head = sph(0.8, cream); head.position.set(0, 1.75, 0.55); g.add(head);
  const topfluff = sph(0.5, cream); topfluff.position.set(0, 2.25, 0.45); g.add(topfluff);
  const muzzle = sph(0.42, new THREE.MeshStandardMaterial({ color: 0xfbf3e0 }), 1,0.85,1.1);
  muzzle.position.set(0, 1.62, 1.15); g.add(muzzle);
  const nose = sph(0.15, dark); nose.position.set(0, 1.7, 1.5); g.add(nose);
  // 눈
  for (const sx of [-0.32, 0.32]) {
    const eye = sph(0.12, dark); eye.position.set(sx, 1.9, 1.25); g.add(eye);
    const shine = sph(0.04, new THREE.MeshStandardMaterial({ color: 0xffffff })); shine.position.set(sx+0.04, 1.96, 1.34); g.add(shine);
  }
  // 혀
  const tongue = sph(0.12, pink, 1, 0.6, 1); tongue.position.set(0, 1.5, 1.42); g.add(tongue);

  // 긴 곱슬 귀 (양옆, 아래로)
  const ears = [];
  for (const sx of [-1, 1]) {
    const ear = new THREE.Group();
    const e1 = sph(0.28, creamD, 0.7, 1.3, 0.7); e1.position.set(0, -0.25, 0);
    const e2 = sph(0.26, creamD, 0.7, 1.2, 0.7); e2.position.set(0, -0.75, 0.02);
    ear.add(e1); ear.add(e2);
    ear.position.set(sx * 0.72, 1.95, 0.5);
    g.add(ear); ears.push(ear);
  }

  // 빨간 목걸이
  const collar = new THREE.Mesh(new THREE.TorusGeometry(0.62, 0.1, 10, 24), red);
  collar.position.set(0, 1.35, 0.55); collar.rotation.x = Math.PI/2 - 0.35; g.add(collar);
  const tag = sph(0.12, new THREE.MeshStandardMaterial({ color: 0xffcf3a })); tag.position.set(0, 1.15, 1.0); g.add(tag);

  // 다리 4개 (달리기용, 엉덩이에서 회전)
  const legs = [];
  const legPos = [[-0.5, 0.7], [0.5, 0.7], [-0.5, -0.55], [0.5, -0.55]];
  for (const [lx, lz] of legPos) {
    const hip = new THREE.Group();
    const leg = box(0.32, 0.8, 0.32, cream); leg.position.y = -0.4;
    const paw = sph(0.22, creamD, 1, 0.7, 1.2); paw.position.y = -0.78;
    hip.add(leg); hip.add(paw);
    hip.position.set(lx, 0.75, lz);
    g.add(hip); legs.push(hip);
  }

  // 꼬리
  const tail = new THREE.Group();
  const tball = sph(0.25, cream); tball.position.set(0, 0, -0.15); tail.add(tball);
  tail.position.set(0, 1.2, -1.05); g.add(tail);

  g.rotation.y = Math.PI;        // 카메라 반대쪽(앞)으로 달리게
  g.scale.setScalar(0.72);       // 크기 조절
  outer.add(g);
  dogParts = { legs, ears, tail, body };
  return outer;
}

function addTree(i) {
  const t = new THREE.Group();
  const side = i % 2 === 0 ? -1 : 1;
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.32, 1.4, 8),
    new THREE.MeshStandardMaterial({ color: 0x8a5a34 }));
  trunk.position.y = 0.7; trunk.castShadow = true; t.add(trunk);
  const leaf = new THREE.Mesh(new THREE.ConeGeometry(1.1, 2.2, 10),
    new THREE.MeshStandardMaterial({ color: 0x3f9e56 }));
  leaf.position.y = 2.3; leaf.castShadow = true; t.add(leaf);
  t.position.set(side * (5.5 + Math.random()*3), 0, -i * 8 - Math.random()*4);
  scene.add(t); trees.push(t);
}

// ---------- 장애물 / 뼈다귀 ----------
function makeObstacle() {
  const m = new THREE.MeshStandardMaterial({ color: 0xef5a6a, roughness: 0.6 });
  const o = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.3, 1.3), m);
  o.castShadow = true; o.userData.kind = "obstacle";
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(1.32, 0.3, 1.32),
    new THREE.MeshStandardMaterial({ color: 0xffffff }));
  o.add(stripe);
  return o;
}
function makeCoin() {
  const g = new THREE.Group(); g.userData.kind = "coin";
  const gold = new THREE.MeshStandardMaterial({ color: 0xffcf3a, metalness: 0.3, roughness: 0.4 });
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.7, 10), gold); bar.rotation.z = Math.PI/2;
  const b1 = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 8), gold); b1.position.x = -0.42;
  const b2 = b1.clone(); b2.position.x = 0.42;
  const b3 = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 8), gold); b3.position.set(-0.42, 0.28, 0);
  const b4 = b3.clone(); b4.position.set(0.42, 0.28, 0);
  const b5 = b3.clone(); b5.position.set(-0.42, -0.28, 0);
  const b6 = b3.clone(); b6.position.set(0.42, -0.28, 0);
  [bar,b1,b2,b3,b4,b5,b6].forEach(p => { p.castShadow = true; g.add(p); });
  return g;
}

function newGame() {
  // 이전 물체 정리
  for (const o of obstacles) scene.remove(o);
  for (const c of coins) scene.remove(c);
  obstacles.length = 0; coins.length = 0;
  state = {
    running: true, speed: CFG.startSpeed, dist: 0, coins: 0, lives: CFG.lives,
    lane: 1, dogX: 0, dogY: 0, vy: 0, grounded: true, run: 0,
    spawnZ: -40, invuln: 0,
  };
  dog.position.set(0, 0, 0); dog.rotation.y = 0;
  document.getElementById("hud").style.display = "flex";
  document.getElementById("pad").style.display = "flex";
  document.getElementById("start").classList.add("hidden");
  document.getElementById("over").classList.add("hidden");
  updateHUD();
}

// ---------- 새 줄(장애물+뼈다귀) 생성 ----------
function spawnRow(z) {
  // 한 레인은 반드시 비워서 지날 수 있게
  const free = Math.floor(Math.random() * 3);
  for (let L = 0; L < 3; L++) {
    if (L === free) {
      // 빈 레인엔 가끔 뼈다귀 줄
      if (Math.random() < 0.7) {
        for (let k = 0; k < 3; k++) {
          const c = makeCoin();
          c.position.set(CFG.lanes[L], 1.0, z - k * 2.2);
          scene.add(c); coins.push(c);
        }
      }
    } else {
      if (Math.random() < 0.62) {
        const o = makeObstacle();
        o.position.set(CFG.lanes[L], 0.65, z);
        scene.add(o); obstacles.push(o);
      } else if (Math.random() < 0.4) {
        const c = makeCoin();
        c.position.set(CFG.lanes[L], 1.0, z);
        scene.add(c); coins.push(c);
      }
    }
  }
}

// ---------- 조작 ----------
function moveLane(dir) {
  if (!state || !state.running) return;
  state.lane = Math.max(0, Math.min(2, state.lane + dir));
}
function jump() {
  if (!state || !state.running || !state.grounded) return;
  state.vy = CFG.jumpPower; state.grounded = false;
}
function bindControls() {
  document.getElementById("kL").onclick = () => moveLane(-1);
  document.getElementById("kR").onclick = () => moveLane(1);
  document.getElementById("kJ").onclick = () => jump();
  addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") moveLane(-1);
    if (e.key === "ArrowRight") moveLane(1);
    if (e.key === "ArrowUp" || e.key === " ") jump();
  });
  // 스와이프
  let sx = 0, sy = 0, tracking = false;
  const cvs = document.getElementById("c");
  cvs.addEventListener("touchstart", e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; tracking = true; }, { passive: true });
  cvs.addEventListener("touchend", e => {
    if (!tracking) return; tracking = false;
    const t = e.changedTouches[0]; const dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > Math.abs(dy)) { if (Math.abs(dx) > 24) moveLane(dx > 0 ? 1 : -1); }
    else { if (dy < -24) jump(); }
  }, { passive: true });
}

// ---------- 매 프레임 ----------
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (state && state.running) update(dt);
  renderer.render(scene, camera);
}

function update(dt) {
  const s = state;
  s.speed = Math.min(CFG.maxSpeed, s.speed + CFG.accel * dt);
  const move = s.speed * dt;
  s.dist += move;
  if (s.invuln > 0) s.invuln -= dt;

  // 줄무늬 이동(속도감)
  for (const st of stripes) { st.position.z += move; if (st.position.z > 12) st.position.z -= 110; }
  // 나무 이동
  for (const t of trees) { t.position.z += move; if (t.position.z > 12) { t.position.z -= 128; t.position.x = (t.position.x>0?1:-1)*(5.5+Math.random()*3); } }

  // 장애물·뼈다귀 이동 + 재활용
  for (const o of obstacles) o.position.z += move;
  for (const c of coins) { c.position.z += move; c.rotation.z += dt * 6; }

  // 새 줄 생성
  s.spawnZ += move;
  const gap = 9 - Math.min(3, s.speed * 0.12); // 빨라질수록 촘촘
  if (s.spawnZ > -46) { spawnRow(-58); s.spawnZ = -58 + gap; }
  // 화면 뒤로 지난 것 제거
  cull(obstacles); cull(coins);

  // 강아지 좌우 레인 이동(부드럽게)
  const targetX = CFG.lanes[s.lane];
  s.dogX += (targetX - s.dogX) * Math.min(1, dt * 12);
  dog.position.x = s.dogX;
  dog.rotation.y = (targetX - s.dogX) * -0.5; // 살짝 기울기
  // 카메라가 강아지를 살짝 따라가서 화면 가운데쯤에 유지
  camera.position.x += (s.dogX * 0.5 - camera.position.x) * Math.min(1, dt * 4);
  camera.lookAt(s.dogX * 0.25, 0.9, -8);

  // 점프/중력
  if (!s.grounded) {
    s.vy -= CFG.gravity * dt;
    s.dogY += s.vy * dt;
    if (s.dogY <= 0) { s.dogY = 0; s.vy = 0; s.grounded = true; }
  }
  dog.position.y = s.dogY;

  // 달리기 애니메이션
  s.run += dt * s.speed * 0.9;
  const sw = Math.sin(s.run);
  if (dogParts) {
    dogParts.legs[0].rotation.x = sw * 0.8;
    dogParts.legs[1].rotation.x = -sw * 0.8;
    dogParts.legs[2].rotation.x = -sw * 0.8;
    dogParts.legs[3].rotation.x = sw * 0.8;
    dogParts.ears.forEach((e,i)=> e.rotation.x = Math.sin(s.run + i) * 0.25 + (s.grounded?0:-0.3));
    dogParts.tail.rotation.z = Math.sin(s.run * 1.5) * 0.5;
    dogParts.body.position.y = 1.0 + Math.abs(sw) * 0.08;
  }
  // 점프 중 살짝 앞으로 숙임
  dog.rotation.x = s.grounded ? 0 : -Math.min(0.3, s.vy * 0.02);

  // 충돌 판정
  const dogZ = 0;
  for (const o of obstacles) {
    if (o.userData.hit) continue;
    if (Math.abs(o.position.z - dogZ) < 0.9 && Math.abs(o.position.x - s.dogX) < 0.95) {
      if (s.dogY < 1.1) { // 점프로 넘지 못하면 충돌
        o.userData.hit = true;
        if (s.invuln <= 0) hitObstacle(o);
      }
    }
  }
  for (const c of coins) {
    if (c.userData.taken) continue;
    if (Math.abs(c.position.z - dogZ) < 0.9 && Math.abs(c.position.x - s.dogX) < 0.9 && Math.abs(c.position.y - (s.dogY + 1.0)) < 1.1) {
      c.userData.taken = true; c.visible = false; s.coins++; updateHUD();
    }
  }

  updateHUD();
}

function cull(arr) {
  for (let i = arr.length - 1; i >= 0; i--) {
    if (arr[i].position.z > 12 || arr[i].userData.taken) { scene.remove(arr[i]); arr.splice(i, 1); }
  }
}

function hitObstacle(o) {
  state.lives--; state.invuln = 1.2;
  scene.remove(o);
  const idx = obstacles.indexOf(o); if (idx>=0) obstacles.splice(idx,1);
  updateHUD();
  if (state.lives <= 0) endGame();
}

function endGame() {
  state.running = false;
  const m = Math.floor(state.dist);
  const best = Math.max(m, Number(localStorage.getItem("dogrun_best") || 0));
  localStorage.setItem("dogrun_best", String(best));
  document.getElementById("ovTitle").textContent = "💫 게임 오버";
  document.getElementById("ovText").innerHTML = `${m} m 달렸어요! 🦴 ${state.coins}개<br>최고 기록 🏆 ${best} m`;
  document.getElementById("over").classList.remove("hidden");
  document.getElementById("pad").style.display = "none";
}

function updateHUD() {
  document.getElementById("m").textContent = Math.floor(state.dist);
  document.getElementById("coins").textContent = state.coins;
  document.getElementById("lives").textContent = state.lives;
  // 무적 깜빡임
  if (dog) dog.visible = !(state.invuln > 0 && Math.floor(state.invuln * 12) % 2 === 0);
}

function onResize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

// ---------- 시작 버튼 ----------
document.getElementById("play").onclick = newGame;
document.getElementById("again").onclick = newGame;

// ---------- 폰 설치용 (미리보기에서는 조용히 무시) ----------
if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js").catch(()=>{}); } catch(e){} }

// 엔진 로드 확인 후 시작
if (window.THREE) init();
else document.getElementById("loading").textContent = "3D 엔진을 불러오지 못했어요 😢";
</script>
